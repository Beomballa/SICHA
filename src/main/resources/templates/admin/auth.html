<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>시차 · 관리자 인증</title>
    <link rel="stylesheet" href="/admin/auth.css" />
    <script defer src="/admin/ui.js"></script>
    <script defer src="/admin/shell.js"></script>
    <script defer src="/admin/auth.js"></script>
  </head>
  <body
    th:attr="data-screen=${screen}"
    th:classappend="${#strings.startsWith(screen, 'ADMIN_')} ? 'admin-app' : ''"
  >
    <a class="skip-link" href="#page-title">현재 화면으로 바로 이동</a>
    <aside
      th:replace="~{admin/fragments :: navigation(${#strings.startsWith(screen, 'ADMIN_') ? 'security' : null}, ${canManage})}"
    ></aside>
    <div class="admin-workspace">
      <main class="shell">
        <nav
          th:if="${#strings.startsWith(screen, 'ADMIN_')}"
          class="admin-breadcrumb"
          aria-label="현재 위치"
        >
          <a href="/admin">대시보드</a
          ><a href="/admin?tab=security">보안 관리</a>
          <a
            th:if="${screen == 'ADMIN_ACCOUNTS' || screen == 'ADMIN_ACCOUNT_DETAIL'}"
            href="/admin/accounts"
            >관리자 계정</a
          >
        </nav>
        <header class="auth-page-header">
          <div>
            <p class="eyebrow">시차 · 관리자 보안</p>
            <h1 id="page-title" tabindex="-1">관리자 인증</h1>
          </div>
          <a
            th:if="${screen == 'ADMIN_ACCOUNT_DETAIL'}"
            href="/admin/accounts"
            class="secondary-link"
            >계정 목록으로</a
          >
        </header>
        <p th:if="${screen == 'ADMIN_ACCOUNTS'}" class="account-page-guide">
          계정을 찾고 현재 상태와 설정된 작업 자격을 확인하세요. 자료
          조회·변경에는 MANAGE와 최근 재인증이 필요합니다.
        </p>
        <p
          th:if="${screen == 'ADMIN_ACCOUNT_DETAIL'}"
          class="account-page-guide"
        >
          계정 정보·작업 자격·활성 상태를 분리해 관리합니다. 변경은 최신
          수정번호와 현재 권한을 서버가 다시 확인합니다.
        </p>
        <p id="notice" role="status" aria-live="polite">
          현재 상태를 확인하고 있습니다.
        </p>
        <div id="content" aria-busy="true"></div>
        <nav
          th:if="${screen != 'ADMIN_ACCOUNTS' && screen != 'ADMIN_ACCOUNT_DETAIL'}"
          aria-label="인증 화면 이동"
          class="links"
        >
          <a href="/admin/login">로그인</a><a href="/admin/enroll">등록</a>
          <a href="/admin/recovery/password">비밀번호 복구</a
          ><a href="/admin/recovery/mfa">MFA 복구</a>
        </nav>
      </main>
    </div>
    <dialog th:replace="~{admin/fragments :: reauthentication}"></dialog>
  </body>
</html>
