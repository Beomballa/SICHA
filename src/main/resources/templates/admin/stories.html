<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>시차 · 관리자 사건 목록</title>
    <link rel="stylesheet" href="/admin/stories.css" />
    <script defer src="/admin/stories.js"></script>
  </head>
  <body data-screen="list">
    <a class="skip-link" href="#list-heading">사건 목록으로 바로 이동</a>
    <main class="shell">
      <nav class="top-nav" aria-label="관리자 화면">
        <a href="/admin">관리자 시작</a>
        <span class="workspace-label">시차 · 관리자 제작실</span>
      </nav>
      <header class="page-header list-header">
        <div>
          <p class="eyebrow">기록을 모으고, 사건의 진상을 구성하다</p>
          <h1>사건 기록부</h1>
          <p class="muted">접근 가능한 사건의 원고와 개정 상태를 확인합니다.</p>
        </div>
        <a href="#create-heading" id="create-jump" class="primary-link" hidden
          >새 초안 만들기</a
        >
      </header>
      <p id="notice" role="status" aria-live="polite">
        현재 목록을 확인하고 있습니다.
      </p>
      <div class="list-workbench">
        <section aria-labelledby="list-heading" class="list-panel">
          <div class="register-heading">
            <h2 id="list-heading" tabindex="-1">사건 문서</h2>
            <span class="muted">생성 최신순</span>
          </div>
          <form id="filter-form" class="filters">
            <div>
              <label for="code">사건 코드 정확 검색</label
              ><input
                id="code"
                name="code"
                autocomplete="off"
                placeholder="ST_…"
                pattern="[A-Z0-9_]{1,40}"
              />
            </div>
            <div>
              <label for="active">사건 상태</label
              ><select id="active" name="activeYn">
                <option value="true">활성</option>
                <option value="false">비활성 (본인 사건)</option>
              </select>
            </div>
            <button type="submit" class="secondary">조회</button>
          </form>
          <p class="muted">
            생성 최신순 · 제목이 아닌 정확한 사건 코드로 검색합니다.
          </p>
          <div id="rows" aria-live="polite" aria-busy="true"></div>
          <button type="button" id="next" class="secondary" hidden>
            다음 페이지
          </button>
        </section>
        <section id="create-panel" hidden aria-labelledby="create-heading">
          <p class="eyebrow">새 기록의 시작</p>
          <h2 id="create-heading" tabindex="-1">사건 파일 만들기</h2>
          <p>
            버전 1의 비공개 초안을 만듭니다. 생성 결과가 불확실하면 자동으로
            재전송하지 않습니다.
          </p>
          <form id="create-form">
            <label for="title">사건명</label
            ><input
              id="title"
              name="title"
              required
              autocomplete="off"
            /><button type="submit">초안 생성</button>
          </form>
          <div id="create-check" hidden>
            <p id="create-check-message"></p>
            <button type="button" id="check-create" class="secondary">
              이 생성의 현재 상태 확인</button
            ><button type="button" id="new-create" class="secondary">
              새 생성 의도 시작
            </button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
