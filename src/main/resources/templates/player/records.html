<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>시차 · 내 플레이 기록</title>
    <link rel="stylesheet" href="/player-public.css" />
    <script type="module" src="/player-common/records-page.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 바로 이동</a>
    <header class="site-header">
      <div class="shell">
        <a class="brand" href="/">시차</a><a href="/play">사건 조사</a
        ><a href="/account">회원 계정</a>
      </div>
    </header>
    <main id="main" class="shell" tabindex="-1">
      <h1>내 플레이 기록</h1>
      <p>
        현재 본인에게 허용된 종료 기록만 조회합니다. 보고서 원문은 별도 버튼으로
        명시 조회하며 이 문서 밖에 저장하지 않습니다.
      </p>
      <p id="status" role="status" aria-live="polite">
        회원 상태를 확인하는 중입니다.
      </p>
      <p id="error" role="alert" hidden></p>
      <div class="actions">
        <button id="connect" class="secondary-action" type="button">
          회원 연결 복구</button
        ><button id="list" class="secondary-action" type="button">
          내 기록 목록 다시 조회</button
        ><button id="next" class="secondary-action" type="button" hidden>
          다음 기록 조회
        </button>
      </div>
      <noscript
        ><p>
          기록 기능에는 JavaScript와 HTTPS·Web Locks 지원이 필요합니다.
        </p></noscript
      >
      <section aria-labelledby="list-title">
        <h2 id="list-title">종료 기록 목록</h2>
        <p id="empty" hidden>현재 본인의 종료 기록이 없습니다.</p>
        <div id="records" class="guide"></div>
      </section>
      <section
        id="detail"
        class="section"
        aria-labelledby="detail-title"
        hidden
      >
        <h2 id="detail-title"></h2>
        <p id="summary"></p>
        <div id="timing"></div>
        <div id="score"></div>
        <div id="purged" class="notice" hidden>
          <h3>공동 원문 파기됨</h3>
          <p>
            공동 보고서가 삭제되어 최소 요약만 제공됩니다. 모드·정확 시각·게임
            연결·제출 보고서·해설은 복원하지 않습니다.
          </p>
        </div>
        <div id="normal" hidden>
          <h3>내 기록의 제출 결과</h3>
          <div id="reports"></div>
          <h3>허용된 서버 해설</h3>
          <p id="reveal" class="notice-body"></p>
          <div class="actions">
            <button id="refresh" class="secondary-action" type="button">
              선택 기록 현재 상태 조회
            </button>
          </div>
        </div>
      </section>
      <section id="raw" class="section" aria-labelledby="raw-title" hidden>
        <h2 id="raw-title">명시 조회한 보고서</h2>
        <p id="report-state"></p>
        <div id="report-body" class="panel notice-body"></div>
        <div id="report-basis"></div>
        <div class="actions">
          <button id="close-raw" class="secondary-action" type="button">
            원문 닫고 폐기
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
