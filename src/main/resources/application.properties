# 시차: Java properties의 ISO-8859-1 로더에서도 이름이 보존되도록 표기한다.
spring.application.name=\uc2dc\ucc28
# 공개 소스에는 로컬 접속 기본값을 두지 않는다. 테스트는 폐기 DB 설정을 주입한다.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.name=__Host-admin-session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
app.auth.crypto-key-file=${AUTH_CRYPTO_KEY_FILE:}
app.auth.search-key-file=${AUTH_SEARCH_KEY_FILE:}
app.auth.limit-key-file=${AUTH_LIMIT_KEY_FILE:}
app.auth.breached-hashes-file=${AUTH_BREACHED_HASHES_FILE:}
app.auth.offline-approvals-file=${AUTH_OFFLINE_APPROVALS_FILE:}
app.auth.offline-approval-public-key-file=${AUTH_OFFLINE_APPROVAL_PUBLIC_KEY_FILE:}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.grading.installations-file=${GRADING_INSTALLATIONS_FILE:}
app.grading.workers-file=${GRADING_WORKERS_FILE:}
# LOCAL 합성 인증만 지원하며 실제 수집은 기본 비활성이다.
app.member-auth.collection-enabled=${MEMBER_AUTH_COLLECTION_ENABLED:false}
app.member-auth.env-code=${MEMBER_AUTH_ENV_CODE:}
app.member-auth.mail-from=${MEMBER_AUTH_MAIL_FROM:}
app.member-auth.evidence-registry-file=${MEMBER_AUTH_EVIDENCE_REGISTRY_FILE:}
app.member-web.enabled=${MEMBER_WEB_ENABLED:false}
app.member-web.origin=${MEMBER_WEB_ORIGIN:}
app.member-web.assets-directory=${MEMBER_WEB_ASSETS_DIRECTORY:}
