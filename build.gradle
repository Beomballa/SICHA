plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.reasoning'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

tasks.named('processResources') {
    // 독립 로컬 SQL은 보존하되 공개 Java 원본만으로 실행·검증하며 빌드 산출물에는 넣지 않는다.
    exclude 'db/migration/**'
}

tasks.withType(Jar).configureEach {
    // 기존 빌드 디렉터리에 남은 독립 SQL도 일반·실행 아카이브 모두에 포함하지 않는다.
    exclude '**/db/migration/**'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'
    implementation 'com.eatthepath:java-otp:1.0.0'
    implementation 'commons-codec:commons-codec'

    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.icegreen:greenmail:2.1.14'
    testImplementation 'com.networknt:json-schema-validator:2.0.7'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/*IT.class'
}

tasks.register('integrationTest', Test) {
    description = 'Runs isolated PostgreSQL integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    exclude '**/*BrowserIT.class'
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.register('uiTest', Exec) {
    description = '공통 UI 규격과 관리자 화면의 Node 회귀를 실행한다.'
    group = 'verification'
    workingDir projectDir
    doFirst {
        def uiFiles = fileTree('src/test/js') { include '*.test.mjs' }.files.sort()
        if (uiFiles.empty) {
            throw new GradleException('관리자 UI 회귀 파일이 없습니다.')
        }
        commandLine(['node', '--test'] + uiFiles.collect { it.absolutePath })
    }
}

tasks.register('browserTest', Test) {
    description = '격리 PostgreSQL과 실제 HTTPS 로그인으로 관리자 화면을 검증한다.'
    group = 'verification'
    inputs.files(fileTree('src/test/browser') {
        include '**/*.mjs', 'zoom-extension/*.js', 'zoom-extension/*.json'
        exclude 'node_modules/**'
    })
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*BrowserIT.class'
    useJUnitPlatform()
    dependsOn tasks.named('uiTest')
    shouldRunAfter tasks.named('integrationTest')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}
